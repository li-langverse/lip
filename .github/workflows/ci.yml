name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lit
          path: lit
          ref: main
      - name: Checkout lic
        uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          # TODO: revert to main after li-langverse/lic#4 merges
          ref: main

      - name: Checkout lis (registry E2E)
        uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: feat/ph-db-4-registry-routes

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 llvm-18-dev

      - name: Build lic and bootstrap lip/lit
        env:
          LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
          CC: clang-18
          CXX: clang++-18
          LI_REPO: ${{ github.workspace }}/lic
          LIS_REPO: ${{ github.workspace }}/lis
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci.sh
